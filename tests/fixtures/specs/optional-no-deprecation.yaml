# Control case: `email` is optional and carries no deprecation marker at all.
# Isolates whether the deprecation metadata changes anything, or whether
# optionality alone is what oasdiff reacts to.
openapi: 3.0.3
info:
  title: Fixture API
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: All users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
