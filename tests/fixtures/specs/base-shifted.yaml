# Byte-for-byte equivalent API to base.yaml, but with comments and blank lines
# that push every definition onto different line numbers.
#
# Used to prove oasdiff's `fingerprint` identifies the CHANGE, not the location.
# Waivers are matched on fingerprint, so if it moved when someone reformatted a
# spec, every waiver would silently stop applying and builds would break for no
# reason.

openapi: 3.0.3

info:
  title: Fixture API
  version: 1.0.0

paths:

  /users:

    get:

      operationId: listUsers

      responses:

        '200':
          description: All users.

          content:
            application/json:

              schema:
                type: array

                items:
                  $ref: '#/components/schemas/User'

components:

  schemas:

    User:
      type: object

      required: [id, name, email]

      properties:

        id:
          type: integer

        name:
          type: string

        email:
          type: string
