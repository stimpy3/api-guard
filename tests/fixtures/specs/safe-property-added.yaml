# Adds an optional property and nothing else. Must NOT fail the gate: a tool
# that blocks additive changes gets switched off within a month.
openapi: 3.0.3
info:
  title: Fixture API
  version: 1.1.0
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: All users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        nickname:
          type: string
